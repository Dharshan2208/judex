server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract the container name from Docker metadata.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container_name"

      # This becomes our primary filter label — "service".
      - source_labels: ["__meta_docker_compose_service"]
        target_label: "service"

      # Keep the Compose project name for multi-project setups.
      - source_labels: ["__meta_docker_compose_project"]
        target_label: "compose_project"

      # Drop the internal Docker container ID
      - action: labeldrop
        regex: "__meta_docker_container_id"
